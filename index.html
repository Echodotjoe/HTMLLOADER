<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purple Arcade</title>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 40%, #4a2c7a 100%);
      min-height: 100vh;
      color: #e8d5ff;
      overflow-x: hidden;
    }

    /* Animated background glow */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                  radial-gradient(circle at 70% 60%, rgba(192, 132, 252, 0.1) 0%, transparent 40%);
      animation: drift 25s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes drift {
      from { transform: translate(0, 0); }
      to { transform: translate(-5%, 5%); }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    header h1 {
      font-size: 3.2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #c084fc, #e879f9, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
      text-shadow: 0 0 40px rgba(168, 85, 247, 0.4);
    }

    header p {
      margin-top: 10px;
      font-size: 1.15rem;
      color: #c4b5fd;
      opacity: 0.9;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 28px;
    }

    .game-card {
      background: linear-gradient(160deg, rgba(88, 28, 135, 0.55), rgba(59, 7, 100, 0.7));
      border: 1px solid rgba(192, 132, 252, 0.25);
      border-radius: 28px;
      padding: 24px 18px 20px;
      text-align: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    .game-card:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: rgba(232, 121, 249, 0.6);
      box-shadow: 0 20px 40px rgba(168, 85, 247, 0.35);
    }

    .game-icon {
      width: 110px;
      height: 110px;
      margin: 0 auto 18px;
      border-radius: 28px;
      background: linear-gradient(145deg, #a855f7, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.5),
                  inset 0 2px 8px rgba(255, 255, 255, 0.2);
      position: relative;
    }

    .game-icon::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
    }

    .game-name {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #f3e8ff;
      word-break: break-word;
      line-height: 1.3;
    }

    .game-type {
      font-size: 0.8rem;
      color: #c4b5fd;
      opacity: 0.75;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg, #c026d3, #a855f7);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(192, 38, 211, 0.4);
    }

    .play-btn:hover {
      background: linear-gradient(90deg, #e879f9, #c084fc);
      transform: scale(1.06);
      box-shadow: 0 6px 20px rgba(232, 121, 249, 0.5);
    }

    .play-btn:active {
      transform: scale(0.97);
    }

    /* ===== Player Overlay ===== */
    #player-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 5, 20, 0.92);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }

    #player-overlay.active {
      display: flex;
    }

    .player-header {
      width: 95%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      color: #e9d5ff;
    }

    .player-header h2 {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .close-btn {
      background: rgba(192, 132, 252, 0.2);
      border: 1px solid rgba(192, 132, 252, 0.4);
      color: #e9d5ff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: rgba(244, 63, 94, 0.4);
      border-color: #f43f5e;
    }

    #player-container {
      width: 95%;
      max-width: 1100px;
      height: 75vh;
      background: #0f0720;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(168, 85, 247, 0.3);
      box-shadow: 0 0 60px rgba(124, 58, 237, 0.3);
      position: relative;
    }

    #player-container iframe,
    #player-container ruffle-player {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #c4b5fd;
      font-size: 1.2rem;
    }

    .empty-state code {
      background: rgba(168, 85, 247, 0.2);
      padding: 2px 8px;
      border-radius: 6px;
      color: #e9d5ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Purple Arcade</h1>
      <p>Select a game and hit Play</p>
    </header>

    <div class="games-grid" id="games-grid">
      <!-- Cards will be generated here -->
    </div>
  </div>

  <!-- Player Overlay -->
  <div id="player-overlay">
    <div class="player-header">
      <h2 id="player-title">Playing...</h2>
      <button class="close-btn" onclick="closePlayer()" title="Close">✕</button>
    </div>
    <div id="player-container"></div>
  </div>

  <script>
    // =====================================================
    //  ADD YOUR FILES HERE
    // =====================================================
    const games = [
      // Examples – replace with your real files
      { name: "Cool HTML Game", file: "items/cool-game.html", type: "html" },
      { name: "Classic SWF Adventure", file: "items/adventure.swf", type: "swf" },
      { name: "Another HTML Game", file: "items/puzzle.html", type: "html" },
      // { name: "My Flash Game", file: "items/mygame.swf", type: "swf" },
    ];

    // =====================================================

    const grid = document.getElementById('games-grid');
    const overlay = document.getElementById('player-overlay');
    const playerContainer = document.getElementById('player-container');
    const playerTitle = document.getElementById('player-title');

    // Icon based on type
    function getIcon(type) {
      return type === 'swf' ? '⚡' : '🎮';
    }

    // Build the cards
    function renderGames() {
      if (games.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            No games found.<br><br>
            Add files to the <code>items</code> folder and list them in the <code>games</code> array.
          </div>`;
        return;
      }

      grid.innerHTML = games.map((game, index) => `
        <div class="game-card">
          <div class="game-icon">${getIcon(game.type)}</div>
          <div class="game-name">${game.name}</div>
          <div class="game-type">${game.type.toUpperCase()}</div>
          <button class="play-btn" onclick="playGame(${index})">
            ▶ Play
          </button>
        </div>
      `).join('');
    }

    function playGame(index) {
      const game = games[index];
      playerTitle.textContent = game.name;
      playerContainer.innerHTML = '';

      if (game.type === 'html') {
        const iframe = document.createElement('iframe');
        iframe.src = game.file;
        iframe.allow = "fullscreen";
        playerContainer.appendChild(iframe);
      } 
      else if (game.type === 'swf') {
        // Ruffle player
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        player.style.width = '100%';
        player.style.height = '100%';
        playerContainer.appendChild(player);
        player.load(game.file);
      }

      overlay.classList.add('active');
    }

    function closePlayer() {
      overlay.classList.remove('active');
      playerContainer.innerHTML = ''; // stop the game
    }

    // Close with Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePlayer();
    });

    // Initialize
    renderGames();
  </script>
</body>
</html>
